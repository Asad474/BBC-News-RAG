[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bbc-news"
version = "0.1.0"
description = "RAG application to retrieve relevant BBC news articles and generate contextual responses"
requires-python = ">=3.12"
dependencies = [
    "langchain-core",
    "langchain-google-genai",
    "langchain-chroma",
    "chromadb",
    "pandas",
    "python-dotenv",
]

[project.scripts]
bbc-rag = "app:main"
bbc-ingest = "ingestion:main"

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools]
py-modules = ["app", "config", "ingestion", "rag"]

[tool.pyrefly]
python-interpreter-path = "virtual/bin/python"

[tool.pyright]
venvPath = "."
venv = "virtual"

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4

exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "virtual",
    "virtualenv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"